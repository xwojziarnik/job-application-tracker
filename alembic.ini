[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# Migrations are numbered 001, 002, ... (D-18): the number is set in migrations/env.py.
file_template = %%(rev)s_%%(slug)s
# Run env.py for every "alembic revision", not only with --autogenerate, so that hand-written
# migrations are numbered too. It connects to the database, so the database must be running.
revision_environment = true
# The database URL comes from application settings (see migrations/env.py).

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
