name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches vulnerabilities published after the last change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      # Fails the build when any installed package has a known vulnerability.
      - name: Dependency audit
        run: pip-audit --skip-editable

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Changelog format
        run: python scripts/release.py check

      - name: Type check
        run: mypy

      # Integration tests start PostgreSQL via testcontainers (Docker is available on the runner).
      - name: Test
        run: pytest -v

  # On main: a commit subject ending with [major], [minor] or [fix] releases a new version.
  release:
    name: Release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the commit range and previous tags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Detect version bump
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Commits in this push; fall back to the last commit for a new branch or force push.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            subjects=$(git log --format=%s "${BEFORE}..HEAD")
          else
            subjects=$(git log -1 --format=%s HEAD)
          fi
          bump=$(printf '%s\n' "$subjects" | python scripts/release.py bump)
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "Requested bump: ${bump:-none}"

      - name: Bump version, update changelog and tag
        if: steps.bump.outputs.bump != ''
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          pip install hatch==1.18.1
          hatch version "$BUMP"
          version=$(hatch version)
          python scripts/release.py release "$version" --date "$(date -u +%F)" --repo-url "$REPO_URL"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/job_tracker/__init__.py
          git commit -m "chore(release): v${version} [skip ci]"
          git tag -a "v${version}" -m "Release v${version}"
          git push --atomic origin HEAD:main "v${version}"
